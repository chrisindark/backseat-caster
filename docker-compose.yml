services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backseatcaster-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=sqlite:////workspace/data/backseatcaster.db
      - DOWNLOADS_DIR=/workspace/data/downloads
      - DEFAULT_YOUTUBE_CHANNEL=${DEFAULT_YOUTUBE_CHANNEL:-}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - HOST=0.0.0.0
      - PORT=3001
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    volumes:
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backseatcaster-worker
    restart: unless-stopped
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=sqlite:////workspace/data/backseatcaster.db
      - DOWNLOADS_DIR=/workspace/data/downloads
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backseatcaster-beat
    restart: unless-stopped
    command: uv run celery -A app.worker.celery_app beat --loglevel=info --schedule=/workspace/data/celerybeat-schedule
    environment:
      - DATABASE_URL=sqlite:////workspace/data/backseatcaster.db
      - DOWNLOADS_DIR=/workspace/data/downloads
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTO_PIPELINE_INTERVAL_MINUTES=${AUTO_PIPELINE_INTERVAL_MINUTES:-0}
    volumes:
      - ./data:/workspace/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: backseatcaster-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: backseatcaster-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    depends_on:
      - backend

volumes:
  redis_data:
