[project]
name = "backseat-caster"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "fastapi-health>=0.4.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.0",
    "httpx2>=2.13.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp>=2025.1.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff==0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "B008", # FastAPI Depends/Field in default args
    "E501", # Line length handled by formatter
    "B904", # raise HTTPException without from e
    "UP046", # Generic class Generic[DataT] for Pydantic compatibility
]

[tool.pyrefly]
exclude = [
    ".venv",
    "**/__pycache__",
    "dist",
    "build"
]
